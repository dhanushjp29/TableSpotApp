<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<title>{{EVENT_LABEL}} · TableSpot</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<!--[if mso]>
<style type="text/css">
table { border-collapse:collapse; mso-table-lspace:0; mso-table-rspace:0; }
</style>
<![endif]-->
</head>
<body style="margin:0;padding:0;background:#f5f0eb;font-family:'Inter',Arial,Helvetica,sans-serif;color:#1a1a1a;-webkit-font-smoothing:antialiased;">

<!-- Outer wrapper -->
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f5f0eb;padding:32px 16px;">
  <tr>
    <td align="center">
      <!-- Email card -->
      <table width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.08);">

        <!-- ── HEADER ──────────────────────────────────────────────── -->
        <tr>
          <td style="background:linear-gradient(135deg,#b91c1c 0%,#c62828 60%,#7f1d1d 100%);padding:32px 40px;text-align:center;">
            <a href="{{CLIENT_URL}}" style="text-decoration:none;" target="_blank">
              <img src="cid:tablespot-logo" alt="TableSpot" width="160" height="auto"
                   style="display:block;margin:0 auto;max-width:160px;height:auto;border:0;background:transparent;border-radius:0;padding:0;" />
            </a>
            <div style="margin-top:14px;font-size:12px;font-weight:500;letter-spacing:1.5px;color:rgba(255,255,255,0.75);text-transform:uppercase;">{{EVENT_LABEL}}</div>
          </td>
        </tr>

        <!-- ── BODY ───────────────────────────────────────────────── -->
        <tr>
          <td style="padding:40px 40px 28px;">

            <!-- Title -->
            <h1 style="margin:0 0 6px;font-size:22px;font-weight:700;color:#111827;line-height:1.3;">{{TITLE}}</h1>

            <!-- Greeting -->
            <p style="margin:0 0 20px;font-size:15px;color:#6b7280;line-height:1.6;">Hi <strong style="color:#111827;">{{NAME}}</strong>,</p>

            <!-- Message -->
            <p style="margin:0 0 28px;font-size:15px;color:#374151;line-height:1.7;">{{MESSAGE}}</p>

            <!-- Details card -->
            <table width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="background:#fafaf9;border:1px solid #e7e5e4;border-radius:12px;margin:0 0 24px;overflow:hidden;">
              <tr>
                <td style="padding:20px 24px;">
                  {{{DETAILS}}}
                </td>
              </tr>
            </table>

            <!-- Instructions block (optional) -->
            {{{INSTRUCTIONS_BLOCK}}}

            <!-- CTA button (optional) -->
            {{{CTA_BLOCK}}}

          </td>
        </tr>

        <!-- ── DIVIDER ─────────────────────────────────────────────── -->
        <tr>
          <td style="padding:0 40px;">
            <table width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="border-top:1px solid #f0ede9;font-size:0;line-height:0;">&nbsp;</td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- ── FOOTER ─────────────────────────────────────────────── -->
        <tr>
          <td style="padding:24px 40px 32px;text-align:center;">
            <p style="margin:0 0 8px;font-size:13px;color:#9ca3af;line-height:1.6;">
              Need help?&nbsp;
              <a href="mailto:{{SUPPORT_EMAIL}}" style="color:#c62828;text-decoration:none;font-weight:500;">{{SUPPORT_EMAIL}}</a>
              &nbsp;&middot;&nbsp;
              <a href="tel:{{SUPPORT_PHONE}}" style="color:#c62828;text-decoration:none;font-weight:500;">{{SUPPORT_PHONE}}</a>
            </p>
            <p style="margin:0;font-size:12px;color:#d1d5db;">
              &copy; {{YEAR}} TableSpot. All rights reserved.
            </p>
          </td>
        </tr>

      </table>
      <!-- /Email card -->
    </td>
  </tr>
</table>

</body>
</html>
